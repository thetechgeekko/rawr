name: Debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Explicit packages: the action's default list still names the removed
      # 'tools' package. Versions pinned in app/build.gradle.kts.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.31.6

      # native/image_scopes embeds its SPIR-V through `uv run`.
      - uses: astral-sh/setup-uv@v6

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee assemble.log || {
            grep -nE "error:|error G|FAILED:|undefined reference|ld.lld: error|CMake Error|What went wrong" assemble.log \
              | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rawr-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Merges to main republish the `debug` prerelease so its download link
      # stays stable. PRs only keep the run artifact.
      - name: Publish debug prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rawr-debug.apk
          gh release delete debug --cleanup-tag --yes || true
          gh release create debug rawr-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug build" \
            --notes "Debug build of ${GITHUB_SHA::8}. Installs alongside release as Rawr Debug."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
